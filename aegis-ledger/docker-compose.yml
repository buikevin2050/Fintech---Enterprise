services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-ledger-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis_ledger
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
      - ./src/ledger/infrastructure/database/migrations/001_init_ledger_schema.sql:/docker-entrypoint-initdb.d/001_init.sql
    command: >
      postgres
      -c synchronous_commit=on
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-ledger-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aegis_ledger
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: aegis_ledger
      DB_POOL_MIN: 5
      DB_POOL_MAX: 20

volumes:
  aegis_pgdata:
    driver: local
